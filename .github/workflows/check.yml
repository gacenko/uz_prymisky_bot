name: Check UZprymisky channel

on:
  repository_dispatch:
    types: [check-channel]
  workflow_dispatch: {}
  # TEMPORARY fallback while the Cloudflare Worker's Cron Trigger is stuck
  # account-wide (confirmed: zero invocations even on a brand-new Worker with
  # a per-minute cron -- this is on Cloudflare's side, not our config).
  # Remove once Cloudflare fixes it and the Worker starts firing again.
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/check_channel.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last_message_id.txt
          git diff --staged --quiet || git commit -m "chore: update last processed message id"
          git push
